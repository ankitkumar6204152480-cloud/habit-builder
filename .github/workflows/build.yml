lname: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Flutter project
        run: flutter create habit_builder --org com.example --platforms android
      - name: Write app files
        run: |
          mkdir -p habit_builder/lib
          cat > habit_builder/lib/main.dart <<'HB_EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:hive_flutter/hive_flutter.dart';

          const _ch = MethodChannel('habit/native');
          const _days = 21;
          const _quote = 'Aaj ka chhota sa discipline, kal ki badi azaadi.';
          late Box box;

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Hive.initFlutter();
            box = await Hive.openBox('plan');
            runApp(const MaterialApp(debugShowCheckedModeBanner: false, home: Home()));
          }

          class Home extends StatefulWidget {
            const Home({super.key});
            @override
            State<Home> createState() => _HomeState();
          }

          class _HomeState extends State<Home> with WidgetsBindingObserver {
            List<Map<String, String>> apps = [];
            final sel = <String, String>{}; // package -> name
            int limit = 30;
            bool usageOk = false, a11yOk = false;

            int? get start => box.get('start') as int?;
            int get day => start == null
                ? 0
                : DateTime.now()
                        .difference(DateTime.fromMillisecondsSinceEpoch(start!))
                        .inDays +
                    1;
            bool get active => start != null && day <= _days;
            bool get done => start != null && day > _days;

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              _load();
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              super.dispose();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState s) {
              if (s == AppLifecycleState.resumed) _load();
            }

            Future<void> _load() async {
              usageOk = await _ch.invokeMethod<bool>('hasUsage') ?? false;
              a11yOk = await _ch.invokeMethod<bool>('hasAccessibility') ?? false;
              if (apps.isEmpty) {
                final l = await _ch.invokeMethod<List>('getApps') ?? [];
                apps = l.map((e) => Map<String, String>.from(e as Map)).toList();
              }
              if (mounted) setState(() {});
            }

            Future<void> _start() async {
              final ok = await showDialog<bool>(
                context: context,
                builder: (c) => AlertDialog(
                  title: const Text('Strict mode'),
                  content: const Text(
                      'Start karne ke baad 21 din tak plan badal ya reset nahi kar paoge. Pakka?'),
                  actions: [
                    TextButton(
                        onPressed: () => Navigator.pop(c, false),
                        child: const Text('Nahi')),
                    TextButton(
                        onPressed: () => Navigator.pop(c, true),
                        child: const Text('Haan, start')),
                  ],
                ),
              );
              if (ok != true) return;
              final now = DateTime.now().millisecondsSinceEpoch;
              await box.putAll({
                'start': now,
                'limit': limit,
                'apps': sel.keys.toList(),
                'names': sel.values.toList(),
              });
              await _ch.invokeMethod('setPlan', {
                'apps': sel.keys.toList(),
                'limit': limit,
                'end': now + _days * 86400000,
              });
              setState(() {});
            }

            Future<void> _newPlan() async {
              await box.clear();
              await _ch.invokeMethod('setPlan', {'apps': <String>[], 'limit': 0, 'end': 0});
              sel.clear();
              setState(() {});
            }

            Widget _streak(int d) => Card(
                  child: ListTile(
                    leading: const Icon(Icons.local_fire_department, color: Colors.orange),
                    title: Text('Streak  $d / $_days'),
                    subtitle: Padding(
                      padding: const EdgeInsets.only(top: 8),
                      child: LinearProgressIndicator(value: d / _days),
                    ),
                  ),
                );

            Widget get _quoteCard => const Card(
                  child: Padding(
                    padding: EdgeInsets.all(16),
                    child: Center(
                      child: Text(_quote,
                          textAlign: TextAlign.center,
                          style: TextStyle(fontSize: 16, fontStyle: FontStyle.italic)),
                    ),
                  ),
                );

            Widget _locked() {
              final names = List<String>.from(box.get('names'));
              return Column(children: [
                _streak(day),
                Card(
                  child: ListTile(
                    leading: const Icon(Icons.lock),
                    title: const Text('Strict mode ON'),
                    subtitle: Text('Reset ${_days - day + 1} din baad'),
                  ),
                ),
                Card(
                  child: ListTile(
                    leading: const Icon(Icons.timer),
                    title: Text('Daily limit: ${box.get('limit')} min per app'),
                    subtitle: Text(names.join(', ')),
                  ),
                ),
                const Spacer(),
                _quoteCard,
              ]);
            }

            Widget _done() => Column(children: [
                  _streak(_days),
                  const SizedBox(height: 16),
                  const Text('21 din poore! 🎉', style: TextStyle(fontSize: 20)),
                  const SizedBox(height: 16),
                  ElevatedButton(onPressed: _newPlan, child: const Text('Naya plan')),
                  const Spacer(),
                  _quoteCard,
                ]);

            Widget _setup() {
              final ready = sel.isNotEmpty && usageOk && a11yOk;
              return Column(children: [
                _streak(0),
                _quoteCard,
                if (!usageOk)
                  ListTile(
                    leading: const Icon(Icons.warning_amber, color: Colors.red),
                    title: const Text('Usage access allow karo'),
                    onTap: () => _ch.invokeMethod('openUsage'),
                  ),
                if (!a11yOk)
                  ListTile(
                    leading: const Icon(Icons.warning_amber, color: Colors.red),
                    title: const Text('Accessibility service on karo'),
                    onTap: () => _ch.invokeMethod('openAccessibility'),
                  ),
                Text('Daily limit per app: $limit min'),
                Slider(
                  value: limit.toDouble(),
                  min: 5,
                  max: 180,
                  divisions: 35,
                  onChanged: (v) => setState(() => limit = v.round()),
                ),
                Expanded(
                  child: ListView(children: [
                    for (final a in apps)
                      CheckboxListTile(
                        title: Text(a['name']!),
                        value: sel.containsKey(a['pkg']),
                        onChanged: (v) {
                          setState(() {
                            if (v == true) {
                              sel[a['pkg']!] = a['name']!;
                            } else {
                              sel.remove(a['pkg']);
                            }
                          });
                        },
                      ),
                  ]),
                ),
                SizedBox(
                  width: double.infinity,
                  child: ElevatedButton(
                    onPressed: ready ? _start : null,
                    child: const Text('Strict mode start (21 din)'),
                  ),
                ),
              ]);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Habit Builder')),
                body: SafeArea(
                  child: Padding(
                    padding: const EdgeInsets.all(16),
                    child: active ? _locked() : (done ? _done() : _setup()),
                  ),
                ),
              );
            }
          }
          HB_EOF
          mkdir -p habit_builder/android/app/src/main
          cat > habit_builder/android/app/src/main/AndroidManifest.xml <<'HB_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:label="Habit Builder"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BlockerService"
                      android:exported="false"
                      android:label="Habit Builder"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          HB_EOF
          mkdir -p habit_builder/android/app/src/main/kotlin/com/example/habit_builder
          cat > habit_builder/android/app/src/main/kotlin/com/example/habit_builder/MainActivity.kt <<'HB_EOF'
          package com.example.habit_builder

          import android.app.AppOpsManager
          import android.content.Context
          import android.content.Intent
          import android.os.Process
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "habit/native")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "getApps" -> {
                                  val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                                  val list = packageManager.queryIntentActivities(i, 0)
                                      .filter { it.activityInfo.packageName != packageName }
                                      .map {
                                          mapOf(
                                              "name" to it.loadLabel(packageManager).toString(),
                                              "pkg" to it.activityInfo.packageName
                                          )
                                      }
                                      .distinctBy { it["pkg"] }
                                      .sortedBy { it["name"]!!.lowercase() }
                                  result.success(list)
                              }
                              "setPlan" -> {
                                  val apps = call.argument<List<String>>("apps") ?: emptyList()
                                  val limit = call.argument<Number>("limit")?.toInt() ?: 0
                                  val end = call.argument<Number>("end")?.toLong() ?: 0L
                                  getSharedPreferences("habit_plan", Context.MODE_PRIVATE).edit()
                                      .putStringSet("apps", apps.toSet())
                                      .putInt("limit", limit)
                                      .putLong("end", end)
                                      .apply()
                                  result.success(null)
                              }
                              "hasUsage" -> {
                                  val ops = getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager
                                  val mode = ops.checkOpNoThrow(
                                      AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), packageName
                                  )
                                  result.success(mode == AppOpsManager.MODE_ALLOWED)
                              }
                              "hasAccessibility" -> {
                                  val s = Settings.Secure.getString(
                                      contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                                  ) ?: ""
                                  result.success(s.contains("$packageName/"))
                              }
                              "openUsage" -> {
                                  startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
                                  result.success(null)
                              }
                              "openAccessibility" -> {
                                  startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                                  result.success(null)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }
          }
          HB_EOF
          mkdir -p habit_builder/android/app/src/main/kotlin/com/example/habit_builder
          cat > habit_builder/android/app/src/main/kotlin/com/example/habit_builder/BlockerService.kt <<'HB_EOF'
          package com.example.habit_builder

          import android.accessibilityservice.AccessibilityService
          import android.app.usage.UsageEvents
          import android.app.usage.UsageStatsManager
          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Toast
          import java.util.Calendar

          class BlockerService : AccessibilityService() {
              private var current = ""
              private val handler = Handler(Looper.getMainLooper())
              private val tick = object : Runnable {
                  override fun run() {
                      enforce(current)
                      handler.postDelayed(this, 10_000)
                  }
              }

              override fun onServiceConnected() {
                  handler.post(tick)
              }

              override fun onDestroy() {
                  handler.removeCallbacks(tick)
                  super.onDestroy()
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e == null || e.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  current = e.packageName?.toString() ?: return
                  enforce(current)
              }

              override fun onInterrupt() {}

              private fun enforce(pkg: String) {
                  if (pkg.isEmpty()) return
                  val p = getSharedPreferences("habit_plan", Context.MODE_PRIVATE)
                  if (System.currentTimeMillis() > p.getLong("end", 0L)) return
                  val apps = p.getStringSet("apps", emptySet()) ?: return
                  if (pkg !in apps) return
                  val limitMs = p.getInt("limit", 0) * 60_000L
                  if (usedTodayMs(pkg) >= limitMs) {
                      performGlobalAction(GLOBAL_ACTION_HOME)
                      Toast.makeText(this, "Aaj ka time khatam", Toast.LENGTH_SHORT).show()
                  }
              }

              @Suppress("DEPRECATION")
              private fun usedTodayMs(pkg: String): Long {
                  val usm = getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
                  val cal = Calendar.getInstance().apply {
                      set(Calendar.HOUR_OF_DAY, 0); set(Calendar.MINUTE, 0)
                      set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
                  }
                  val now = System.currentTimeMillis()
                  val events = usm.queryEvents(cal.timeInMillis, now)
                  val e = UsageEvents.Event()
                  var total = 0L
                  var since = 0L
                  while (events.hasNextEvent()) {
                      events.getNextEvent(e)
                      if (e.packageName != pkg) continue
                      when (e.eventType) {
                          UsageEvents.Event.MOVE_TO_FOREGROUND -> since = e.timeStamp
                          UsageEvents.Event.MOVE_TO_BACKGROUND -> if (since > 0) {
                              total += e.timeStamp - since; since = 0
                          }
                      }
                  }
                  if (since > 0) total += now - since
                  return total
              }
          }
          HB_EOF
          mkdir -p habit_builder/android/app/src/main/res/xml
          cat > habit_builder/android/app/src/main/res/xml/accessibility_config.xml <<'HB_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns
